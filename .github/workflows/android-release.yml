name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 34 platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/autoposter-android.apk
          ls -lh ../dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoposter-android
          path: dist/autoposter-android.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/autoposter-android.apk
          name: "Auto Poster Android ${{ github.ref_name }}"
          body: |
            Android manager app for the Telegram Auto Poster bot.

            Install the APK, then in the app Settings enter:
            - API URL: `http://<bot-machine-IP>:8000`
            - The `API_KEY` from the bot's `.env`
